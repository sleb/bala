[package]
name = "bala-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "bala"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bala-core = { path = "../bala-core" }
bala-store = { path = "../bala-store" }
clap = { version = "4", features = ["derive"] }
directories = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
ratatui = "0.29.0"
crossterm = "0.29.0"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
